name: Relicense v0.1.2 branch

on:
  push:
    branches: [release/v0.1.2-ui-license]
    paths:
      - .github/workflows/relicense-v012.yml

permissions:
  contents: write

jobs:
  relicense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/v0.1.2-ui-license
          fetch-depth: 0
      - name: Apply AGPL-3.0 license and README copy
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt \
            -o LICENSE
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('https://img.shields.io/badge/license-MIT-blue.svg', 'https://img.shields.io/badge/license-AGPL--3.0-blue.svg')
          s = s.replace('alt="License: MIT"', 'alt="License: AGPL-3.0"')
          s = s.replace('This software is provided "as is", without warranty of any kind, as described in the MIT License.', 'This software is provided "as is", without warranty of any kind, as described in the GNU Affero General Public License v3.0.')
          s = s.replace('sudo XPORT_VERSION=v0.1.1 bash', 'sudo XPORT_VERSION=v0.1.2 bash')
          if '\n## License\n' not in s:
              s += '\n\n## License\n\nX-port is licensed under the **GNU Affero General Public License v3.0 (AGPL-3.0-only)**. If you modify X-port and make that modified version available to users over a network, the AGPL requires those users to be offered the corresponding source code.\n\nReleases published before `v0.1.2` remain available under the license terms that applied to those releases, including the earlier MIT-licensed versions.\n'
          p.write_text(s)
          PY
      - name: Commit relicensing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE README.md
          git diff --cached --quiet && exit 0
          git commit -m "license: switch X-port to AGPL-3.0"
          git push origin HEAD:release/v0.1.2-ui-license

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Frontend assets and interrupted account requests
        run: |
          bash scripts/verify-web-assets.sh
          node scripts/verify-account-recovery.cjs
          node scripts/verify-operation-state.cjs
          node scripts/verify-panel-handoff.cjs

      - name: Frontend browser regression
        run: bash scripts/verify-web-browser.sh
      - name: Install CJK font for screenshots
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          has_cjk_font() {
            [[ -n "$(fc-list :lang=zh-cn | sed -n '1p')" ]]
          }
          if has_cjk_font; then
            echo "CJK fonts already installed; skipping apt."
          else
            # Ubuntu runners usually have usable package lists already. An
            # unconditional apt-get update once hung until the 6h runner limit.
            echo "Installing CJK font using cached package lists."
            install_font() {
              timeout --signal=TERM --kill-after=10s 150s \
                sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                  -o DPkg::Lock::Timeout=25 \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 \
                  install -y --no-install-recommends fonts-noto-cjk
            }
            if ! install_font; then
              echo "Initial font installation failed; refreshing package lists with a deadline."
              timeout --signal=TERM --kill-after=10s 90s \
                sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                  -o DPkg::Lock::Timeout=25 \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update -qq
              install_font
            fi
            fc-cache -f
          fi
          has_cjk_font || { echo "::error::No CJK font is available for screenshot validation" >&2; exit 1; }
          echo "CJK font ready: $(fc-match -f '%{family}' 'sans:lang=zh-cn')"
      - name: Frontend UI screenshots
        run: bash scripts/capture-web-preview.sh "$RUNNER_TEMP/xport-ui-preview"
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xport-ui-preview
          path: ${{ runner.temp }}/xport-ui-preview/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Shell syntax and safety
        run: |
          bash -n install.sh scripts/build-linux.sh scripts/install.sh scripts/migrate-xpanel.sh scripts/verify-web-assets.sh scripts/verify-web-browser.sh scripts/capture-web-preview.sh scripts/verify-firewall-runtime.sh
          shellcheck -S error install.sh scripts/*.sh
      - name: Go module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Go vulnerability call paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build Linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/xport ./cmd/xport
          go version -m /tmp/xport | grep -Fq 'go1.27.3'

      - name: Xray management API boundary using real core (disposable runner)
        run: |
          for attempt in 1 2 3 4; do
            if /tmp/xport xray-update --binary "$RUNNER_TEMP/xport-test-xray" --config "$RUNNER_TEMP/xport-missing-test-config.json"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Official Xray download failed after four verified attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          echo '127.0.0.1 xport-loopback-ci.test' | sudo tee -a /etc/hosts >/dev/null
          XPORT_INTEGRATION_XRAY="$RUNNER_TEMP/xport-test-xray" go test ./internal/xray -run '^TestManagementAPIBoundaryWithRealXray$' -count=1 -timeout=90s -v

      - name: Firewall WebUI Linux systemd deployment (old unit sandbox)
        run: sudo bash scripts/verify-firewall-runtime.sh /tmp/xport

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Frontend syntax
        run: |
          node --check web/dist/app.js
          node --check web/dist/extra.js
          node --check web/dist/v3.js
          node --check web/dist/v4.js
          node --check web/dist/v5.js
          node --check web/dist/v5-runtime.js
          node --check web/dist/v6.js
          node --check web/dist/v7.js
          node --check web/dist/v8.js
          node --check web/dist/v9.js
          node --check web/dist/v10.js
          node --check web/dist/v11.js
          node --check web/dist/v12.js
          : > /tmp/xport-web-classic.js
          for file in web/dist/app.js web/dist/extra.js web/dist/v3.js web/dist/v4.js web/dist/v5.js web/dist/v5-runtime.js web/dist/v6.js web/dist/v7.js web/dist/v8.js web/dist/v9.js web/dist/v10.js web/dist/v11.js web/dist/v12.js; do
            printf '\n;\n' >> /tmp/xport-web-classic.js
            cat "$file" >> /tmp/xport-web-classic.js
          done
          node --check /tmp/xport-web-classic.js
      - name: Shell syntax and safety
        run: |
          bash -n install.sh scripts/build-linux.sh scripts/install.sh scripts/migrate-xpanel.sh
          shellcheck -S error install.sh scripts/*.sh
      - name: Go module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Go vulnerability call paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/xport ./cmd/xport

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Frontend assets
        run: bash scripts/verify-web-assets.sh
      - name: Frontend browser regression
        run: bash scripts/verify-web-browser.sh
      - name: Install CJK font for screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Frontend UI screenshots
        run: bash scripts/capture-web-preview.sh "$RUNNER_TEMP/xport-ui-preview"
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xport-ui-preview
          path: ${{ runner.temp }}/xport-ui-preview/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Shell syntax and safety
        run: |
          bash -n install.sh scripts/build-linux.sh scripts/install.sh scripts/migrate-xpanel.sh scripts/verify-web-assets.sh scripts/verify-web-browser.sh scripts/capture-web-preview.sh
          shellcheck -S error install.sh scripts/*.sh
      - name: Go module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Go vulnerability call paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/xport ./cmd/xport

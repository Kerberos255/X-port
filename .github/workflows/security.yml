name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan relevant Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            RANGE="HEAD"
          fi
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git \
            --redact --no-banner --exit-code 1 --log-opts="$RANGE"

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Reject executable browser string sinks
        run: |
          if grep -RInE 'eval\(|new Function|document\.write' web/dist --include='*.js'; then
            echo 'Unsafe executable frontend sink found.' >&2
            exit 1
          fi
      - name: Reject dynamic SQL construction in importer
        run: |
          if grep -RInE 'fmt\.Sprintf\([^\n]*SELECT|fmt\.Sprintf\([^\n]*INSERT|fmt\.Sprintf\([^\n]*UPDATE|fmt\.Sprintf\([^\n]*DELETE' internal --include='*.go'; then
            echo 'Dynamic SQL construction found.' >&2
            exit 1
          fi
      - name: Gosec blocking profile
        # These contextual rules are intentionally covered by app-specific validation/tests:
        # G104 cleanup-close errors; G124 HTTP-local/Secure-cookie mode; G204 argv-only exec
        # with validated service names; G301/G302/G306 executable/systemd/config modes;
        # G304 privileged, bounded paths; G703 trusted daemon config path; G705 PNG QR output.
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          -exclude-generated
          -exclude=G104,G124,G204,G301,G302,G304,G306,G703,G705
          ./...

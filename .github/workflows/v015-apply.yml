name: v0.1.5 apply inbound fixes

on:
  push:
    branches:
      - fix/v0.1.5-inbound-ui
    paths:
      - .github/workflows/v015-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v0.1.5-inbound-ui
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/tmp_v015_patch.py
      - name: Format and validate
        run: |
          gofmt -w internal/service/ports.go internal/service/port_suggestion.go internal/server/port_suggestion.go internal/server/ux_routes.go internal/accountcfg/account.go internal/service/expert.go
          node --check web/dist/v6.js
          go test ./...
          go vet ./...
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal web/dist
          git diff --cached --quiet && exit 0
          git commit -m "fix: align inbound editor and automatic ports"
          git push origin HEAD:fix/v0.1.5-inbound-ui

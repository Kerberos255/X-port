name: Release

on:
  push:
    branches: [main]
    paths:
      - internal/buildinfo/version.go

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify source
        run: |
          node --check web/dist/app.js
          node --check web/dist/extra.js
          node --check web/dist/v3.js
          node --check web/dist/v4.js
          node --check web/dist/v5.js
          node --check web/dist/v5-runtime.js
          node --check web/dist/v6.js
          node --check web/dist/v7.js
          node --check web/dist/v8.js
          bash -n install.sh scripts/build-linux.sh scripts/install.sh scripts/migrate-xpanel.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/buildinfo/version.go)"
          test -n "$VERSION"
          case "$VERSION" in
            *[!0-9A-Za-z.-]*) echo "Invalid version: $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux binaries
        run: |
          ./scripts/build-linux.sh amd64
          ./scripts/build-linux.sh arm64
          test "$(./dist/xport-linux-amd64 version)" = "${{ steps.version.outputs.version }}"
          sha256sum dist/xport-linux-amd64 dist/xport-linux-arm64 > dist/SHA256SUMS

      - name: Attest public release artifacts
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/xport-linux-amd64 \
            dist/xport-linux-arm64 \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "X-port $TAG" \
            --generate-notes \
            --latest
